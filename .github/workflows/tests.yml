name: PowerShell tests
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    # Feed/metadata bot commits touch only data/; run on code changes.
    paths: ['**.ps1', '**.cs', '**.cmd', '**.py', 'lib/**', 'tests/**', '.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: powershell-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 5.1
            shell: powershell
            major: 5
          - name: PowerShell 7
            shell: pwsh
            major: 7
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check PowerShell version
        run: |
          $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
          if ($PSVersionTable.PSVersion.Major -ne ${{ matrix.major }}) { throw "Expected PowerShell ${{ matrix.major }}" }
      - name: Run tests (stubs only; no uTorrent, WebUI or downloads)
        run: |
          & .\tests\Run-All.ps1
          exit $LASTEXITCODE
  linux:
    # Real TLS 1.3 handshakes of the RuTracker transport against local fake servers: the throwaway test CA is trusted
    # only by a child process through SSL_CERT_FILE (Windows has no per-process trust file). Runs the whole suite.
    name: Linux PowerShell 7 (real TLS with a test CA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check PowerShell version
        run: $PSVersionTable | Format-Table -AutoSize | Out-String | Write-Host
      - name: Run tests (fake servers on 127.0.0.x only; no RuTracker, uTorrent or downloads)
        run: |
          & ./tests/Run-All.ps1
          exit $LASTEXITCODE
  python:
    name: Python feed mirror scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run unit tests (fakes only; no RuTracker or GitHub API calls)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
