name: Refresh film feed
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-feed.yml', 'scripts/refresh_feed.py']
  schedule:
    # GitHub creates only part of the scheduled runs: 2026-10-24..11-12 gave about 4 of 48 a day,
    # with gaps up to 11 hours, all of them successful. More slots away from the top of the hour
    # give more chances; cache-metadata.yml is a second, independent trigger. Not a guarantee.
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: refresh-film-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Fetch, validate and publish the Atom snapshot
        run: python3 scripts/refresh_feed.py --caller refresh-feed --min-publish-interval 25
        env:
          GH_TOKEN: ${{ github.token }}
